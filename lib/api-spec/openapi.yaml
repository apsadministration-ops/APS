        mechanicEmail: { type: string }
        currentTier: { $ref: "#/components/schemas/MechanicTier" }
        metrics: { $ref: "#/components/schemas/MechanicMetrics" }
        next:
          oneOf:
            - { $ref: "#/components/schemas/NextTierEvaluation" }
            - { type: "null" }
        flaggedForAdminReview: { type: boolean }
      required: [mechanicId, mechanicName, mechanicEmail, currentTier, metrics, flaggedForAdminReview]

    PromoteMechanicBody:
      type: object
      properties:
        bypassThresholds: { type: boolean }
