    CreateWorkLogBody:
      type: object
      properties:
        jobId:
          type: integer
        serviceCategory:
          type: string
          enum: [repair, diagnostic, maintenance, detailing]
        serviceDescription:
          type: string
        mileageAtService:
          type: integer
          minimum: 0
          description: Odometer reading at time of service. Required.
        laborCost:
          type: number
        partsCost:
          type: number
        partsUsed:
          type: array
          items:
            type: string
        notes:
          type: string
        beforeImages:
          type: array
          items:
            type: string
        afterImages:
          type: array
          items:
            type: string
        upsells:
          type: array
          description: Optional upsells/recommendations. Only items with customerApproved=true earn mechanic points.
          items:
            type: object
            properties:
              description:
                type: string
              amount:
                type: number
              customerApproved:
                type: boolean
            required: [description, amount, customerApproved]
        laborHours:
          type: number
        diagnosticCodes:
          type: array
