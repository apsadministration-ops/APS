openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: APS - Automotive Platform System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User management
  - name: vehicles
    description: Vehicle management (VIN-centric)
  - name: ownership
    description: Vehicle ownership history
  - name: jobs
    description: Service job management
  - name: worklogs
    description: Immutable work log records
  - name: payments
    description: Payment management
  - name: dashboard
    description: Summary and analytics endpoints
  - name: assistant
    description: AI Assistant for explaining repairs and parts
  - name: shops
    description: Ghost Garage shop management (shop owners list bays for rent)
  - name: bays
    description: Rentable service bays inside a shop
  - name: bookings
    description: Mechanic-to-shop bay rental bookings
  - name: inspections
    description: Pre and post-service vehicle inspections (Ghost Garage)
  - name: progression
    description: Mechanic tier progression — certifications, performance, promotions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # Users (admin)
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [customer, mechanic, admin]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, suspended, pending]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/mechanic-profile:
    get:
      operationId: getMechanicProfile
      tags: [users]
      summary: Get mechanic profile with stats
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Mechanic profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicProfile"

  # Vehicles
  /vehicles:
    get:
      operationId: listVehicles
      tags: [vehicles]
      summary: List vehicles owned by current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleWithOwnership"

    post:
      operationId: createVehicle
      tags: [vehicles]
      summary: Register a vehicle by VIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVehicleBody"
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleWithOwnership"
        "409":
          description: VIN already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicles/vin/{vin}:
    get:
      operationId: getVehicleByVin
      tags: [vehicles]
      summary: Lookup vehicle by VIN
      security:
        - bearerAuth: []
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleWithOwnership"
        "404":
          description: VIN not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicles/{vehicleId}:
    get:
      operationId: getVehicle
      tags: [vehicles]
      summary: Get vehicle by ID
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleWithOwnership"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vehicles/{vehicleId}/history:
    get:
      operationId: getVehicleHistory
      tags: [vehicles]
      summary: Get full VIN-based service history for a vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Service history entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkLog"

  /vehicles/{vehicleId}/component-specs:
    get:
      operationId: getVehicleComponentSpecs
      tags: [vehicles]
      summary: VIN-derived component specs (tires, wipers, suspension) for the Vehicle Workbench
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: query
          required: true
          description: Active job that authorizes Workbench access (assigned mechanic only).
          schema:
            type: integer
      responses:
        "200":
          description: Component specs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentSpecs"

  /vehicles/{vehicleId}/parts-catalog:
    get:
      operationId: getVehiclePartsCatalog
      tags: [vehicles]
      summary: VIN-compatible parts catalog with supplier deep-links
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: query
          required: true
          description: Active job that authorizes Workbench access (assigned mechanic only).
          schema:
            type: integer
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [all, engine, brakes, suspension, filters, fluids, electrical, wipers, tires]
      responses:
        "200":
          description: Catalog response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartsCatalogResponse"

  /vehicles/{vehicleId}/recommendations:
    get:
      operationId: getVehicleRecommendations
      tags: [vehicles]
      summary: Service recommendations from mileage rules + history + known failure points
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
        - name: jobId
          in: query
          required: true
          description: Active job that authorizes Workbench access (assigned mechanic only).
          schema:
            type: integer
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceRecommendation"

  /vehicles/{vehicleId}/transfer:
    post:
      operationId: transferVehicle
      tags: [vehicles]
      summary: Initiate vehicle ownership transfer
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferVehicleBody"
      responses:
        "200":
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipRecord"

  # Ownership
  /ownership/{vehicleId}:
    get:
      operationId: getOwnershipHistory
      tags: [ownership]
      summary: Get ownership history for a vehicle
      security:
        - bearerAuth: []
      parameters:
        - name: vehicleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ownership history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnershipRecord"

  # Jobs
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs (filtered by role and query params)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [REQUESTED, OFFERED, ACCEPTED, EN_ROUTE, IN_PROGRESS, COMPLETED, PAID, CANCELLED]
        - name: vehicleId
          in: query
          schema:
            type: integer
        - name: mechanicId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a service request (customer only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/available:
    get:
      operationId: listAvailableJobs
      tags: [jobs]
      summary: List available jobs for mechanics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job by ID
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{jobId}/status:
    patch:
      operationId: updateJobStatus
      tags: [jobs]
      summary: Update job status
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobStatusBody"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}/accept:
    post:
      operationId: acceptJob
      tags: [jobs]
      summary: Mechanic accepts a job
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}/cancel:
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job (customer, before ACCEPTED)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}/rate-customer:
    post:
      operationId: rateCustomer
      tags: [jobs]
      summary: Mechanic rates customer + optional review/flag (mechanic only, after COMPLETED)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCustomerBody"
      responses:
        "200":
          description: Customer rated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}/rate:
    post:
      operationId: rateJob
      tags: [jobs]
      summary: Rate a completed job (customer only)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateJobBody"
      responses:
        "200":
          description: Rated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  # Work Logs
  /worklogs:
    post:
      operationId: createWorkLog
      tags: [worklogs]
      summary: Submit a work log (mechanic only, on job completion)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkLogBody"
      responses:
        "201":
          description: Work log created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"

  /worklogs/vin/{vin}:
    get:
      operationId: getWorkLogsByVin
      tags: [worklogs]
      summary: Get all work logs for a VIN
      security:
        - bearerAuth: []
      parameters:
        - name: vin
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Work logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkLog"

  /worklogs/{worklogId}:
    get:
      operationId: getWorkLog
      tags: [worklogs]
      summary: Get a single work log
      security:
        - bearerAuth: []
      parameters:
        - name: worklogId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Work log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"

  # Payments
  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments (admin or own)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"

  /payments/{jobId}/release:
    post:
      operationId: releasePayment
      tags: [payments]
      summary: Release payment to mechanic (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  # Dashboard / Summary
  /dashboard/customer:
    get:
      operationId: getCustomerDashboard
      tags: [dashboard]
      summary: Customer dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDashboard"

  /dashboard/mechanic:
    get:
      operationId: getMechanicDashboard
      tags: [dashboard]
      summary: Mechanic dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Mechanic summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicDashboard"

  /dashboard/admin:
    get:
      operationId: getAdminDashboard
      tags: [dashboard]
      summary: Admin dashboard summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Admin summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"

  # Mechanics directory
  /mechanics:
    get:
      operationId: listMechanics
      tags: [mechanics]
      summary: Browse available mechanics with ratings, reviews, and favorite/flag info
      security:
        - bearerAuth: []
      parameters:
        - name: jobType
          in: query
          required: false
          schema:
            type: string
            enum: [repair, diagnostic, maintenance, detailing]
      responses:
        "200":
          description: List of mechanics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MechanicSummary"

  /mechanics/{mechanicId}/reviews:
    get:
      operationId: getMechanicReviews
      tags: [mechanics]
      summary: Get all reviews left for a mechanic by customers
      security:
        - bearerAuth: []
      parameters:
        - name: mechanicId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /me/reviews:
    get:
      operationId: getMyReviews
      tags: [mechanics]
      summary: Reviews left for the current user (by the other party)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  # Favorites
  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: Customer's favorite mechanics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Add a mechanic to favorites (customer only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFavoriteBody"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"

  /favorites/{mechanicId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a mechanic from favorites (customer only)
      security:
        - bearerAuth: []
      parameters:
        - name: mechanicId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]

  # Flags / Reports
  /flags:
    get:
      operationId: listFlags
      tags: [flags]
      summary: List flags. Admin sees all; users see flags they have filed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flag"
    post:
      operationId: createFlag
      tags: [flags]
      summary: Report a customer or mechanic
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlagBody"
      responses:
        "201":
          description: Flag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"

  /flags/{flagId}/resolve:
    post:
      operationId: resolveFlag
      tags: [flags]
      summary: Mark a flag resolved (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: flagId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flag"

  /assistant/chat:
    post:
      operationId: assistantChat
      tags: [assistant]
      summary: Send a message to the AI Assistant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatRequest"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantChatResponse"

  # ────────────── Ghost Garage ──────────────
  /shops:
    post:
      operationId: createShop
      tags: [shops]
      summary: Create a new shop (shop_owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShopBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/mine:
    get:
      operationId: listMyShops
      tags: [shops]
      summary: List shops owned by the current shop_owner
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"

  /shops/{shopId}:
    get:
      operationId: getShop
      tags: [shops]
      summary: Get a shop with its bays
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopWithBays"
    patch:
      operationId: updateShop
      tags: [shops]
      summary: Update a shop (owner only)
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShopBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{shopId}/bays:
    post:
      operationId: createBay
      tags: [bays]
      summary: Add a bay to a shop (owner only)
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBayBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bay"
    get:
      operationId: listShopBays
      tags: [bays]
      summary: List bays for a shop
      parameters:
        - name: shopId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bay"

  /bays/available:
    get:
      operationId: listAvailableBays
      tags: [bays]
      summary: Search bookable bays (active mechanic only)
      parameters:
        - name: jobCategory
          in: query
          required: false
          schema:
            type: string
            enum: [repair, diagnostic, maintenance, detailing]
        - name: minTier
          in: query
          required: false
          schema:
            type: string
            enum: [detailer, technician, senior, advanced, master]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BayWithShop"

  /bays/{bayId}:
    get:
      operationId: getBay
      tags: [bays]
      summary: Get a single bay with its shop
      parameters:
        - name: bayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BayWithShop"
    patch:
      operationId: updateBay
      tags: [bays]
      summary: Update a bay (owner only)
      parameters:
        - name: bayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBayBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bay"

  /bays/{bayId}/bookings:
    post:
      operationId: createBayBooking
      tags: [bookings]
      summary: Reserve a bay for a job (active mechanic; tier and category enforced)
      parameters:
        - name: bayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBayBookingBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BayBooking"

  /bookings/mine:
    get:
      operationId: listMyBookings
      tags: [bookings]
      summary: List bookings for the current user (mechanic sees own; shop_owner sees own shops')
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BayBooking"

  /bookings/{bookingId}/start:
    patch:
      operationId: startBayBooking
      tags: [bookings]
      summary: Mechanic marks the booking as active (work has begun)
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BayBooking"

  /bookings/{bookingId}/complete:
    patch:
      operationId: completeBayBooking
      tags: [bookings]
      summary: Mechanic ends the booking; total cost is computed from elapsed time
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BayBooking"

  /bookings/{bookingId}/cancel:
    patch:
      operationId: cancelBayBooking
      tags: [bookings]
      summary: Cancel a booking (mechanic or shop owner)
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BayBooking"

  /jobs/{jobId}/inspections:
    post:
      operationId: createInspection
      tags: [inspections]
      summary: Submit a pre or post-service inspection (active mechanic; immutable)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInspectionBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inspection"
    get:
      operationId: listJobInspections
      tags: [inspections]
      summary: List inspections for a job (admin, customer, or assigned mechanic)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Inspection"

  /jobs/{jobId}/transport-approval:
    post:
      operationId: approveJobTransport
      tags: [jobs]
      summary: Customer approves vehicle transport to a shop bay
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{jobId}/transport:
    get:
      operationId: listTransportLegs
      tags: [transport]
      summary: List vehicle transport legs for a job (outbound + return)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Transport legs ordered newest-first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TransportLeg" }

  /jobs/{jobId}/transport/legs:
    post:
      operationId: startTransportLeg
      tags: [transport]
      summary: Mechanic starts a transport leg (must log start mileage)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartTransportLegBody" }
      responses:
        "201":
          description: Leg started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransportLeg" }

  /jobs/{jobId}/transport/legs/{legId}/finish:
    patch:
      operationId: finishTransportLeg
      tags: [transport]
      summary: Mechanic completes the leg with end mileage
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: integer } }
        - { name: legId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FinishTransportLegBody" }
      responses:
        "200":
          description: Leg finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransportLeg" }

  /jobs/{jobId}/transport/legs/{legId}/location:
    patch:
      operationId: updateTransportLegLocation
      tags: [transport]
      summary: Mechanic GPS heartbeat while driving the customer's vehicle
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: integer } }
        - { name: legId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
              required: [lat, lng]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransportLeg" }

  /mechanic/me/progression:
    get:
      operationId: getMyProgression
      tags: [progression]
      summary: Current tier, performance metrics, and next-tier eligibility for the authenticated mechanic
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Progression snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressionSnapshot" }

  /mechanic/me/promotion-history:
    get:
      operationId: listMyPromotionHistory
      tags: [progression]
      summary: Immutable promotion audit log for the authenticated mechanic
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Promotion history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TierPromotion" }

  /mechanic/me/certifications:
    get:
      operationId: listMyCertifications
      tags: [progression]
      summary: Authenticated mechanic's certifications (any status)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Certifications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MechanicCertification" }
    post:
      operationId: createMyCertification
      tags: [progression]
      summary: Upload a new certification (status starts as pending)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCertificationBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MechanicCertification" }

  /mechanic/me/certifications/{id}:
    delete:
      operationId: deleteMyCertification
      tags: [progression]
      summary: Remove a still-pending certification
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Removed

  /admin/certifications:
    get:
      operationId: listAdminCertifications
      tags: [progression]
      summary: Certification review queue (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, rejected]
      responses:
        "200":
          description: Certifications with mechanic context
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MechanicCertificationWithMechanic" }

  /admin/certifications/{id}:
    patch:
      operationId: reviewCertification
      tags: [progression]
      summary: Verify or reject a certification (admin); verified certs trigger re-evaluation
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewCertificationBody" }
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewCertificationResult" }

  /admin/promotions/pending:
    get:
      operationId: listPendingPromotions
      tags: [progression]
      summary: Advanced-tier mechanics evaluated for master promotion
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Master-tier candidates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MasterCandidate" }

  /admin/mechanics/{id}/progression:
    get:
      operationId: getMechanicProgression
      tags: [progression]
      summary: Detailed progression snapshot + promotion history for a mechanic (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Progression with history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProgressionSnapshot" }

  /admin/mechanics/{id}/promote:
    post:
      operationId: promoteMechanic
      tags: [progression]
      summary: Admin-finalize a master promotion. Validates engine eligibility unless bypassThresholds=true.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoteMechanicBody" }
      responses:
        "200":
          description: Promoted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressionSnapshot" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # Auth
    RegisterBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [customer, mechanic, shop_owner]
        address:
          type: string
        city:
          type: string
        region:
          type: string
        zipCode:
          type: string
        homeLat:
          type: number
        homeLng:
          type: number
        serviceRadiusMiles:
          type: integer
        referredBy:
          type: string
      required: [name, email, password, role, address, city, region, zipCode]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [token, user]

    # User
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [customer, mechanic, admin, shop_owner]
        status:
          type: string
          enum: [active, suspended, pending]
        avatarUrl:
          type: string
          nullable: true
        referralCode:
          type: string
          nullable: true
        mechanicTier:
          type: string
          enum: [detailer, technician, senior, advanced, master]
          nullable: true
        certifications:
          type: string
          nullable: true
        loyaltyPoints:
          type: integer
        mechanicPoints:
          type: integer
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        zipCode:
          type: string
          nullable: true
        homeLat:
          type: number
          nullable: true
        homeLng:
          type: number
          nullable: true
        serviceRadiusMiles:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, status, createdAt]

    UpdateUserBody:
      type: object
      properties:
        status:
          type: string
          enum: [active, suspended, pending]
        name:
          type: string
        phone:
          type: string
        mechanicTier:
          type: string
          enum: [detailer, technician, senior, advanced, master]
        certifications:
          type: string

    MechanicProfile:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        totalJobs:
          type: integer
        completedJobs:
          type: integer
        averageRating:
          type: number
          nullable: true
        totalEarnings:
          type: number
      required: [user, totalJobs, completedJobs, totalEarnings]

    # Vehicles
    Vehicle:
      type: object
      properties:
        id:
          type: integer
        vin:
          type: string
        plateNumber:
          type: string
          nullable: true
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        trim:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        mileage:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, vin, make, model, year, mileage, createdAt]

    VehicleWithOwnership:
      allOf:
        - $ref: "#/components/schemas/Vehicle"
        - type: object
          properties:
            currentOwner:
              $ref: "#/components/schemas/User"
              nullable: true
            isCurrentUserOwner:
              type: boolean
            serviceCount:
              type: integer

    CreateVehicleBody:
      type: object
      properties:
        vin:
          type: string
          minLength: 17
          maxLength: 17
        plateNumber:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
        trim:
          type: string
        color:
          type: string
        mileage:
          type: integer
          minimum: 0
          description: Current odometer reading in miles. Required.
      required: [vin, make, model, year, mileage]

    TransferVehicleBody:
      type: object
      properties:
        newOwnerEmail:
          type: string
          format: email
      required: [newOwnerEmail]

    OwnershipRecord:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        vin:
          type: string
        userId:
          type: integer
        userName:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        transferVerified:
          type: boolean
      required: [id, vehicleId, vin, userId, userName, startDate, transferVerified]

    # Jobs
    Job:
      type: object
      properties:
        id:
          type: integer
        vehicleId:
          type: integer
        vin:
          type: string
        customerId:
          type: integer
        customerName:
          type: string
        mechanicId:
          type: integer
          nullable: true
        mechanicName:
          type: string
          nullable: true
        jobType:
          type: string
          enum: [repair, diagnostic, maintenance, detailing]
        description:
          type: string
        locationLat:
          type: number
          nullable: true
        locationLng:
          type: number
          nullable: true
        locationAddress:
          type: string
          nullable: true
        status:
          type: string
          enum: [REQUESTED, OFFERED, ACCEPTED, EN_ROUTE, IN_PROGRESS, COMPLETED, PAID, CANCELLED]
        estimatedPrice:
          type: number
          nullable: true
        finalPrice:
          type: number
          nullable: true
        rating:
          type: integer
          nullable: true
        ratingNote:
          type: string
          nullable: true
        mechanicLat:
          type: number
          nullable: true
        mechanicLng:
          type: number
          nullable: true
        mechanicLocationUpdatedAt:
          type: string
          format: date-time
          nullable: true
        vehicle:
          $ref: "#/components/schemas/Vehicle"
          nullable: true
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        mechanicReviewText:
          type: string
          nullable: true
        customerRating:
          type: integer
          nullable: true
        customerReviewText:
          type: string
          nullable: true
        requestedMechanicId:
          type: integer
          nullable: true
        requiresGhostGarage:
          type: boolean
          description: True when the job needs an indoor shop bay (lift, etc). Gates work-log submission on pre + post inspections.
        customerTransportApproved:
          type: boolean
          description: Whether the customer has approved their vehicle being transported to a shop bay. Always true for non-ghost-garage jobs.
      required: [id, vehicleId, vin, customerId, customerName, jobType, description, status, createdAt]

    CreateJobBody:
      type: object
      properties:
        vehicleId:
          type: integer
        jobType:
          type: string
          enum: [repair, diagnostic, maintenance, detailing]
        description:
          type: string
        locationLat:
          type: number
        locationLng:
          type: number
        locationAddress:
          type: string
        estimatedPrice:
          type: number
        requestedMechanicId:
          type: integer
          description: If set, only this mechanic sees the job in Available.
      required: [vehicleId, jobType, description]

    TransportLeg:
      type: object
      properties:
        id: { type: integer }
        jobId: { type: integer }
        driverId: { type: integer }
        direction: { type: string, enum: [outbound, return] }
        status: { type: string, enum: [in_progress, completed, cancelled] }
        startMileage: { type: integer }
        endMileage: { type: integer, nullable: true }
        miles: { type: integer, nullable: true, description: "endMileage - startMileage when completed" }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        startLat: { type: number, nullable: true }
        startLng: { type: number, nullable: true }
        endLat: { type: number, nullable: true }
        endLng: { type: number, nullable: true }
        lastLat: { type: number, nullable: true }
        lastLng: { type: number, nullable: true }
        lastLocationAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
      required: [id, jobId, driverId, direction, status, startMileage, startedAt]

    StartTransportLegBody:
      type: object
      properties:
        direction: { type: string, enum: [outbound, return] }
        startMileage: { type: integer, minimum: 0 }
        startLat: { type: number }
        startLng: { type: number }
        notes: { type: string }
      required: [direction, startMileage]

    FinishTransportLegBody:
      type: object
      properties:
        endMileage: { type: integer, minimum: 0 }
        endLat: { type: number }
        endLng: { type: number }
        notes: { type: string }
      required: [endMileage]

    UpdateJobStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [REQUESTED, OFFERED, ACCEPTED, EN_ROUTE, IN_PROGRESS, COMPLETED, PAID, CANCELLED]
        estimatedPrice:
          type: number
      required: [status]

    RateJobBody:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        note:
          type: string
        reviewText:
          type: string
      required: [rating]

    RateCustomerBody:
      type: object
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewText:
          type: string
      required: [rating]

    Favorite:
      type: object
      properties:
        id:
          type: integer
        mechanicId:
          type: integer
        mechanicName:
          type: string
        mechanicTier:
          type: string
          nullable: true
        averageRating:
          type: number
          nullable: true
        completedJobs:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, mechanicId, mechanicName, completedJobs, createdAt]

    AddFavoriteBody:
      type: object
      properties:
        mechanicId:
          type: integer
